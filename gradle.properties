# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -Xms4G
org.gradle.parallel=true

downloadJavadoc=true
downloadSources=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# 默认编译目标 = 全局最老支持线（universal jar 策略，见 AGENTS.md）；
# CI 矩阵用同名 key 的 -P 覆盖。
minecraft_version=26.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=0.1.0
maven_group=bid.yuanlu.mc.warehouse
archives_base_name=yuanlu-warehouse

# Dependencies
# 以下 key 与 CI -P 覆盖同名（见 matrix-test.yml / doc/testing.md）
# fabricApiVersion: 可按矩阵覆盖 -PfabricApiVersion
fabricApiVersion=0.155.2+26.1.2
