name: pr-check

# feature 分支（dev/xxx、fix/xxx）推送与 PR 的快速检查：JUnit + 编译 JAR。
# develop / master 走全面门禁：matrix-test（版本矩阵 + E2E）+ build（打包）。
# 产物仅供人工取用，不等同 release 产物。
on:
  pull_request:
  push:
    branches-ignore:
      - master
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build JAR (+ JUnit)
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: yuanlu-warehouse
          path: build/libs/
