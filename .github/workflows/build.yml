name: build

# 全面门禁：编译 + 打包（产物等同 release 产物，自动产出）。
# 单人开发流程：dev/xxx → develop → master → 手动发版。
# develop 是合入 master 前的完整验证门禁，因此 develop 与 master 都跑全量构建；
# tag 触发用于留档 release 引用构建。feature 分支/PR 的快速检查在 pr-check.yml，
# 版本矩阵 + E2E 在 matrix-test.yml。
on:
  push:
    branches: [master, develop]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/reusable-package.yml
    with:
      ref: ${{ github.ref }}
      artifact-name: yuanlu-warehouse
      run-tests: true
    secrets: inherit
